{{define "project_new"}}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projekt anlegen · ISMS</title>
  <link rel="stylesheet" href="{{href "/ui/app.css"}}">
  <link rel="icon" type="image/svg+xml" href="{{href "/ui/favicon.svg"}}">
</head>
<body>
  <div class="app">
    {{template "header" .}}
    <main class="main">
      <p><a href="{{href "/projects"}}">Projekte</a> / Anlegen</p>
      <h1>Projekt anlegen</h1>
      <p class="lede">Name, Katalogversion und Sichtbarkeit festlegen. Die Version lässt sich später nicht mehr ändern.</p>
      {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
      <form class="card" method="post" action="{{href "/projects/new"}}">
        {{template "csrf" .}}
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" required value="{{.Project.Name}}">
        </div>
        <div class="field">
          <label for="description">Beschreibung</label>
          <textarea id="description" name="description" rows="4">{{.Project.Description}}</textarea>
        </div>
        <div class="field">
          <label for="catalogVersion">Katalogversion</label>
          <select id="catalogVersion" name="catalogVersion">
            {{range .CatalogVersions}}
            <option value="{{.}}" {{if eq . $.Project.CatalogVersion}}selected{{end}}>{{.}}</option>
            {{end}}
          </select>
        </div>
        <fieldset class="field">
          <legend>Sichtbarkeit</legend>
          <div class="choice">
            <label>
              <input type="radio" name="visibility" value="private" {{if ne .Project.Visibility "public"}}checked{{end}}>
              <span><strong>Privat</strong> — nur Mitglieder des Projekts sehen es.</span>
            </label>
            <label>
              <input type="radio" name="visibility" value="public" {{if eq .Project.Visibility "public"}}checked{{end}}>
              <span><strong>Öffentlich</strong> — sichtbar ohne Konto, Änderungen nur durch Mitglieder.</span>
            </label>
          </div>
        </fieldset>
        <div class="form-actions">
          <button class="btn" type="submit">Anlegen</button>
          <a class="btn btn-secondary" href="{{href "/projects"}}">Abbrechen</a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>
{{end}}
