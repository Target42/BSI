{{define "login"}}
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmelden · ISMS</title>
  <link rel="stylesheet" href="{{href "/ui/app.css"}}">
  <link rel="icon" type="image/svg+xml" href="{{href "/ui/favicon.svg"}}">
</head>
<body>
  <div class="login-wrap">
    <form class="card login-card" method="post" action="{{href "/login"}}">
      {{template "brand-mark"}}
      <h1>ISMS</h1>
      <p class="lede">Anmelden, um private Projekte zu sehen oder zu bearbeiten. Öffentliche Projekte sind ohne Konto sichtbar.</p>
      {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
      {{if .NextPath}}<input type="hidden" name="next" value="{{.NextPath}}">{{end}}
      <div class="field">
        <label for="email">E-Mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required value="{{.Email}}">
      </div>
      <div class="field">
        <label for="password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">Anmelden</button>
    </form>
  </div>
</body>
</html>
{{end}}
