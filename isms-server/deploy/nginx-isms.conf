# Host-nginx für ISMS hinter DuckDNS / Let's Encrypt
# Neben anderen vHosts (Wahlhelfer, Nextcloud, …). Nicht default_server setzen.
#
# Go-Server nur lokal (nicht :8098 ins Internet öffnen):
#   HTTP_ADDR=127.0.0.1:8098
#   ENV=production
#   TRUSTED_PROXIES=127.0.0.1,::1
#
# Hostnamen isms.duckdns.org überall ersetzen, falls der DuckDNS-Name anders ist.
#
#   sudo cp deploy/nginx-isms.conf /etc/nginx/sites-available/isms
#   sudo ln -sf /etc/nginx/sites-available/isms /etc/nginx/sites-enabled/isms
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d isms.duckdns.org
#
# Certbot hängt SSL an diesen vHost und stellt HTTP auf Redirect um.
# DuckDNS-A-Record auf die öffentliche IP; Router 80 und 443 zum nginx-Host.

upstream isms_backend {
    server 127.0.0.1:8098;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name isms.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 100m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    location / {
        proxy_pass http://isms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
    }
}

