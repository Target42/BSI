# ISMS auf einer eigenen Subdomain (DuckDNS, interne DNS-Zone, …).
# Go nur lokal, TLS macht nginx (Certbot). Port 8098 nicht nach außen öffnen.
#
#   HTTP_ADDR=127.0.0.1:8098
#   ENV=production
#   TRUSTED_PROXIES=127.0.0.1,::1
#   WEB_PUBLIC_BASE leer lassen
#
# Hostname isms.example.com ersetzen, oder:
#   sudo isms-setup-nginx subdomain isms.example.com
#
#   sudo cp deploy/nginx-isms.conf /etc/nginx/sites-available/isms.conf
#   sudo ln -sf /etc/nginx/sites-available/isms.conf /etc/nginx/sites-enabled/isms.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d isms.example.com
#
# Andere Variante (Pfad auf bestehendem vHost): deploy/nginx-prefix.conf

upstream isms_backend {
    server 127.0.0.1:8098;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name isms.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 100m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    location / {
        proxy_pass http://isms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
    }
}

