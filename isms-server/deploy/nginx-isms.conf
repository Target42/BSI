# ISMS hinter nginx (nur Port 80/443 nach außen).
# Der Go-Server bleibt lokal: HTTP_ADDR=127.0.0.1:8080
#
# Eigenen Hostnamen verwenden, damit andere vHosts unangetastet bleiben
# (nicht default_server setzen).
#
#   sudo cp deploy/nginx-isms.conf /etc/nginx/sites-available/isms
#   sudo ln -s /etc/nginx/sites-available/isms /etc/nginx/sites-enabled/isms
#   sudo nginx -t && sudo systemctl reload nginx
#
# Client-URL: https://isms.example.com

upstream isms_backend {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name isms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name isms.example.com;

    # Bestehende Zertifikate eintragen (Let's Encrypt oder internes CA-Zertifikat).
    ssl_certificate     /etc/letsencrypt/live/isms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isms.example.com/privkey.pem;

    client_max_body_size 100m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    location / {
        proxy_pass http://isms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_request_buffering off;
    }
}

# Alternative, wenn kein eigener Hostname möglich ist: in den bestehenden
