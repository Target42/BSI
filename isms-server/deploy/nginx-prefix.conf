# ISMS hinter einem Pfad-Prefix auf einem bestehenden vHost.
# In den server { }-Block (üblicherweise den HTTPS-vHost) aufnehmen:
#
#   include snippets/isms-prefix.conf;
#
# Oder: sudo isms-setup-nginx prefix /isms
#
# Go-Umgebung (/etc/isms/isms.env), Vorlage deploy/isms.env.nginx-prefix.example:
#   HTTP_ADDR=127.0.0.1:8098
#   ENV=production
#   TRUSTED_PROXIES=127.0.0.1,::1
#   WEB_PUBLIC_BASE=/isms
#
# Client-URL: https://<host>/isms
# Port 8098 nicht nach außen öffnen.

location = /isms {
    return 301 /isms/;
}

location /isms/ {
    client_max_body_size 100m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    proxy_pass http://127.0.0.1:8098/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /isms;
    proxy_set_header Authorization $http_authorization;
    proxy_request_buffering off;
}
