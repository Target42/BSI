name: isms-werkzeug
arch: ${NFPM_ARCH}
platform: linux
version: ${ISMS_VERSION}
release: "1"
section: utils
priority: optional
maintainer: ${ISMS_MAINTAINER}
vendor: ISMS
homepage: https://github.com/Target42/BSI
license: LicenseRef-ISMS
description: |
  ISMS-Werkzeug (Qt-Client) für IT-Grundschutz.
  Desktop-Client zum Bearbeiten von Zielobjekten, Bausteinen und Maßnahmen.
contents:
  - src: ${ISMS_CLIENT_BIN}
    dst: /usr/bin/isms-werkzeug
    file_info:
      mode: 0755
  - src: ${ISMS_ROOT}/packaging/isms-client/isms-werkzeug.desktop
    dst: /usr/share/applications/isms-werkzeug.desktop
    file_info:
      mode: 0644
  - src: ${ISMS_ROOT}/packaging/isms-client/isms-werkzeug.svg
    dst: /usr/share/icons/hicolor/scalable/apps/isms-werkzeug.svg
    file_info:
      mode: 0644
scripts:
  postinstall: ${ISMS_ROOT}/packaging/isms-client/postinstall.sh
recommends:
  - hunspell-de-de
overrides:
  deb:
    depends:
      - libc6
      - libqt6widgets6 | libqt6widgets6t64
      - libqt6gui6 | libqt6gui6t64
      - libqt6core6 | libqt6core6t64
      - libqt6network6 | libqt6network6t64
      - libqt6sql6 | libqt6sql6t64
      - libqt6xml6 | libqt6xml6t64
      - libqt6printsupport6 | libqt6printsupport6t64
    recommends:
      - libqt6sql6-sqlite
      - libhunspell-1.7-0 | libhunspell-1.7-0t64
      - hunspell-de-de
  rpm:
    depends:
      - qt6-qtbase
    recommends:
      - hunspell
      - hunspell-de
